name: "re-openOMSI Windows x64 beta"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/re-openomsi-build.yml'
      - 'overlay/re-openOMSI-DEV06.zip'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENOMSI_VERSION: '0.3.42-reopen.1'
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout our update
        uses: actions/checkout@v4

      - name: Merge re-openOMSI changes onto pinned openOMSI 0.3.42
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -c core.autocrlf=false clone --depth 1 --branch v0.3.42 https://github.com/openOMSI-org/openOMSI.git source
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone upstream 0.3.42' }
          $base = (git -C source rev-parse HEAD).Trim()
          if ($base -ne 'e624dfbfaec0fac92ee78f9eca57bf845544a503') {
            throw "Upstream source changed, refusing to build: $base"
          }
          git -C source fetch --depth 1 origin 'refs/tags/v0.3.41:refs/tags/v0.3.41'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch 0.3.41 merge base' }
          $archive = 'overlay/re-openOMSI-DEV06.zip'
          if (!(Test-Path $archive)) { throw 'Missing re-openOMSI source overlay' }
          $overlay = Join-Path $env:RUNNER_TEMP 'reopen-overlay'
          $scratch = Join-Path $env:RUNNER_TEMP 'reopen-merge'
          New-Item -ItemType Directory -Force -Path $overlay,$scratch | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $overlay -Force
          $merged = 0
          $copied = 0
          $conflicts = @()
          foreach ($file in (Get-ChildItem $overlay -File -Recurse)) {
            $relative = $file.FullName.Substring($overlay.Length + 1).Replace([char]92, '/')
            $destination = Join-Path 'source' $relative
            $parent = Split-Path $destination -Parent
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            if (!(Test-Path $destination)) {
              Copy-Item $file.FullName $destination -Force
              $copied++
              continue
            }
            git -C source diff --quiet v0.3.41 HEAD -- $relative
            $changed = $LASTEXITCODE
            if ($changed -eq 0) {
              Copy-Item $file.FullName $destination -Force
              $copied++
              continue
            }
            if ($changed -ne 1) { throw "Could not compare upstream history: $relative" }
            $basePath = Join-Path $scratch 'base.txt'
            $candidate = Join-Path $scratch 'candidate.txt'
            git -C source show "v0.3.41:$relative" > $basePath
            if ($LASTEXITCODE -ne 0) { throw "Cannot read original file for merge: $relative" }
            Copy-Item $destination $candidate -Force
            git merge-file --diff3 $candidate $basePath $file.FullName
            if ($LASTEXITCODE -ne 0) {
              $resolved = $false
              if ($relative -eq 'launcher/src-tauri/src/commands.rs') {
                $conflictText = [System.IO.File]::ReadAllText($candidate)
                $pattern = '(?s)<<<<<<<[^\r\n]*\r?\n.*?\|{7}[^\r\n]*\r?\n.*?=======[^\r\n]*\r?\n.*?>>>>>>>[^\r\n]*\r?\n'
                $matches = [regex]::Matches($conflictText, $pattern)
                if ($matches.Count -eq 1 -and $matches[0].Value.Contains('pick_data_folder') -and $matches[0].Value.Contains('reopen_appearance_get')) {
                  $handler = '    tauri::generate_handler![call, call_bytes, pick_folder, pick_data_folder, pick_file, pick_mod, pick_hofs, open_path, open_url, update_relaunch, selftest_done, fit_zoom, reopen_appearance_get, reopen_appearance_save, reopen_image_save]' + "`n"
                  $fixed = [regex]::Replace($conflictText, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $handler }, 1)
                  [System.IO.File]::WriteAllText($candidate, $fixed, [System.Text.UTF8Encoding]::new($false))
                  $resolved = $true
                  Write-Host "Resolved known 0.3.42 launcher handler conflict, retaining data-folder and re-openOMSI commands"
                }
              }
              if (!$resolved) {
                Write-Host "::error::Merge conflict in $relative"
                $lines = @(Get-Content -LiteralPath $candidate)
                foreach ($i in (0..($lines.Count - 1))) {
                  if ($lines[$i] -match '^<{7}') {
                    $j = $i
                    while ($j -lt $lines.Count -and $lines[$j] -notmatch '^>{7}') { $j++ }
                    $last = [Math]::Min($lines.Count - 1, [Math]::Min($j + 3, $i + 90))
                    $first = [Math]::Max(0, $i - 3)
                    for ($n = $first; $n -le $last; $n++) { Write-Host ("L{0}: {1}" -f ($n + 1), $lines[$n]) }
                  }
                }
                $conflicts += $relative
                continue
              }
            }
            Copy-Item $candidate $destination -Force
            Write-Host "Merged upstream changes and re-openOMSI: $relative"
            $merged++
          }
          if ($conflicts.Count -gt 0) { throw ("Unresolved upstream conflicts, no release: " + ($conflicts -join ', ')) }
          foreach ($needed in @('source/crates/omsi-platform/src/updater.rs', 'source/launcher/ui/js/appearance.js', 'source/crates/omsi-navigator/src/city_map.rs')) {
            if (!(Test-Path $needed)) { throw "Missing patch source: $needed" }
          }
          $updater = Get-Content source/crates/omsi-platform/src/updater.rs -Raw
          if (!$updater.Contains('kenni-darkus/re-openOMSI')) { throw 'Updater still points at upstream releases' }
          Write-Host "re-openOMSI overlay: $copied applied, $merged merged cleanly, upstream $base"

      - name: Rust MSVC tools
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source -> target
            source/launcher/src-tauri -> target

      - name: Build Windows game and launcher
        shell: cmd
        working-directory: source
        run: scripts\build-windows.cmd x86_64-pc-windows-msvc

      - name: Include official DirectX 11 ANGLE binaries (SHA-256 verified)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force angle | Out-Null
          gh release download angle-8091-36b74e4dd4 -R openOMSI-org/angle-openomsi --pattern '*-windows-x64.zip' -D angle
          if ($LASTEXITCODE -ne 0) { throw 'ANGLE download failed' }
          $zip = Get-ChildItem 'angle/*.zip' | Select-Object -First 1
          if (!$zip) { throw 'ANGLE archive missing' }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '1c0086155a17445110dd97400018ca6e72ea245ef178989b457720ee1fba3af5') {
            throw "Unexpected ANGLE archive hash: $hash"
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath angle/unpacked -Force
          foreach ($dll in @('libEGL.dll','libGLESv2.dll')) {
            $item = Get-ChildItem angle/unpacked -Filter $dll -Recurse -File | Select-Object -First 1
            if (!$item) { throw "Missing ANGLE DLL: $dll" }
            Copy-Item $item.FullName source/dist/windows/$dll -Force
          }
          $license = Get-ChildItem angle/unpacked -Filter 'LICENSE-ANGLE.txt' -Recurse -File | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName source/dist/windows/LICENSE-ANGLE.txt -Force }

      - name: Include Windows C++ runtime and project license
        shell: pwsh
        run: |
          Copy-Item source/LICENSE source/dist/windows/LICENSE
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            $path = Join-Path $env:WINDIR "System32/$dll"
            if (!(Test-Path $path)) { throw "Missing VC++ runtime: $path" }
            Copy-Item $path source/dist/windows/$dll -Force
          }

      - name: Create verified game update archive
        shell: pwsh
        run: |
          foreach ($exe in @('openomsi.exe','openomsi-launcher.exe','openomsi-launcher-app.exe','omsi-plugin-host32.exe')) {
            if (!(Test-Path "source/dist/windows/$exe")) { throw "Build missing $exe" }
          }
          $zip = "re-openOMSI-$env:OPENOMSI_VERSION-windows-x64.zip"
          Compress-Archive -Path source/dist/windows/* -DestinationPath $zip -Force
          if (!(Test-Path $zip)) { throw 'Could not create release zip' }
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$zip.sha256"
          Write-Host "Built $zip"

      - name: Save Windows build for download
        uses: actions/upload-artifact@v4
        with:
          name: re-openOMSI-Windows-x64-${{ env.OPENOMSI_VERSION }}
          path: |
            re-openOMSI-${{ env.OPENOMSI_VERSION }}-windows-x64.zip
            re-openOMSI-${{ env.OPENOMSI_VERSION }}-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta update to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:OPENOMSI_VERSION"
          $zip = "re-openOMSI-$env:OPENOMSI_VERSION-windows-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump the re-open revision before publishing another update" }
          gh release create $tag $zip "$zip.sha256" --prerelease --title "re-openOMSI $env:OPENOMSI_VERSION (Beta)" --notes "Custom Windows x64 build with launcher themes, GTX 1050 profiles and GPS changes. DirectX 11 remains optional via official ANGLE. TEST version: preserve your current game folder until verified. Based on openOMSI v0.3.41 (AGPL-3.0)." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish beta release' }